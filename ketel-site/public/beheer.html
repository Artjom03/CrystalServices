<!doctype html>
<html lang="nl-BE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Beheer – Haard & Ketel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#17191b; --ink-2:#33373b; --muted:#62676c; --paper:#f2f2ef; --white:#fff;
    --line:#d8d8d3; --copper:#a8592a; --copper-dark:#874520; --copper-tint:#f3e9e1;
    --ok:#2f7d4a; --ok-tint:#e6f2ea; --err:#b42318; --err-tint:#fbeae8; --radius:4px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Schibsted Grotesk",system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.5;font-size:16px;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  button,input,select{font:inherit;color:inherit}
  .wrap{width:min(1100px,100% - 32px);margin-inline:auto}
  .mono{font-family:"IBM Plex Mono",monospace}
  .label{font-family:"IBM Plex Mono",monospace;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:var(--radius);border:1px solid var(--ink);background:var(--white);font-weight:600;cursor:pointer;text-decoration:none;font-size:.95rem;line-height:1.2}
  .btn:hover{background:var(--ink);color:#fff}
  .btn.dark{background:var(--ink);color:#fff}
  .btn.dark:hover{background:var(--copper);border-color:var(--copper)}
  .btn.small{padding:7px 12px;font-size:.88rem}
  .btn.danger{border-color:var(--err);color:var(--err)}
  .btn.danger:hover{background:var(--err);color:#fff}
  :focus-visible{outline:2px solid var(--copper);outline-offset:2px}
  [hidden]{display:none!important}

  header{background:var(--ink);color:#fff}
  header .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;height:64px}
  header b{font-weight:800;letter-spacing:-.02em}
  header b span{font-weight:400;color:#9a9fa4;margin-left:8px}
  header .btn{background:transparent;color:#fff;border-color:#55595d}

  /* Login */
  .login{max-width:400px;margin:12vh auto 0;background:var(--white);border:1px solid var(--line);padding:32px}
  .login h1{font-size:1.5rem;margin:8px 0 18px;letter-spacing:-.02em}
  .login label{display:grid;gap:6px;font-weight:500;font-size:.9rem;margin-bottom:16px}
  input,select{padding:10px 12px;border:1px solid #c4c4be;border-radius:var(--radius);background:var(--white)}
  .msg{padding:12px 14px;border-left:3px solid var(--copper);background:var(--copper-tint);font-size:.93rem}
  .msg.err{border-color:var(--err);background:var(--err-tint)}
  .msg.ok{border-color:var(--ok);background:var(--ok-tint)}

  /* Tabs */
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:28px 0 24px}
  .tabs button{background:none;border:0;padding:12px 18px;font-weight:600;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
  .tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--copper)}

  /* Samenvatting */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
  .stat{background:var(--white);border:1px solid var(--line);padding:16px 18px}
  .stat b{display:block;font-size:1.8rem;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .stat span{color:var(--muted);font-size:.9rem}
  .bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .seg{display:inline-flex;border:1px solid var(--ink);border-radius:var(--radius);overflow:hidden}
  .seg button{background:var(--white);border:0;padding:8px 14px;font-weight:600;cursor:pointer;font-size:.9rem}
  .seg button+button{border-left:1px solid var(--ink)}
  .seg button[aria-pressed="true"]{background:var(--ink);color:#fff}

  /* Agenda */
  .day{margin-bottom:28px}
  .day-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0;border-bottom:2px solid var(--ink);margin-bottom:12px;flex-wrap:wrap}
  .day-head h2{font-size:1.25rem;letter-spacing:-.02em}
  .day-head h2 small{font-weight:500;color:var(--copper);margin-left:10px;font-size:.85rem}
  .part{display:grid;grid-template-columns:120px 1fr;gap:16px;margin-bottom:14px}
  .part-label{padding-top:14px}
  .part-label b{display:block}
  .part-label span{font-size:.85rem;color:var(--muted)}
  .cards{display:grid;gap:10px;min-width:0}
  .appt{background:var(--white);border:1px solid var(--line);border-left:3px solid var(--copper);padding:16px 18px;display:grid;grid-template-columns:1fr auto;gap:8px 20px}
  .appt>*{min-width:0}
  .appt h3{font-size:1.08rem;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .pill{font-size:.75rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--paper);border:1px solid var(--line);color:var(--ink-2)}
  .pill.storing{background:var(--err-tint);border-color:#f0c4be;color:var(--err)}
  .info{display:grid;gap:4px;margin-top:6px;font-size:.95rem}
  .info a{text-decoration:none;font-weight:500}
  .info a:hover{color:var(--copper);text-decoration:underline}
  .info .ic{display:inline-block;width:22px;color:var(--muted)}
  .note{margin-top:8px;padding:8px 12px;background:var(--paper);font-size:.92rem;color:var(--ink-2);overflow-wrap:anywhere}
  .meta{font-size:.8rem;color:var(--muted);margin-top:6px}
  .acts{display:flex;flex-direction:column;gap:6px;align-items:stretch}
  .confirm{display:flex;gap:6px;align-items:center;font-size:.88rem;flex-wrap:wrap}
  .empty{background:var(--white);border:1px dashed #c4c4be;padding:28px;text-align:center;color:var(--muted)}
  @media (max-width:700px){
    .stats{gap:8px}.stat{padding:12px}.stat b{font-size:1.5rem}.stat span{font-size:.8rem;line-height:1.3;display:block}
    .part{grid-template-columns:1fr;gap:6px}.part-label{padding-top:0}
    .appt{grid-template-columns:1fr}.acts{flex-direction:row;flex-wrap:wrap}
  }

  /* Beschikbaarheid */
  .panel{background:var(--white);border:1px solid var(--line);padding:22px}
  .wk-nav{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .wk-nav b{min-width:220px;text-align:center}
  .grid-scroll{overflow-x:auto}
  .wk{display:grid;grid-template-columns:repeat(6,minmax(110px,1fr));gap:8px;min-width:680px}
  .wk-col{display:grid;gap:6px;align-content:start}
  .wk-col h4{font-size:.88rem;text-align:center;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .wk-col h4 small{display:block;font-weight:400;color:var(--muted)}
  .slot{padding:12px 6px;border:1px dashed #c4c4be;border-radius:var(--radius);background:var(--white);color:var(--muted);cursor:pointer;font-weight:600;line-height:1.3}
  .slot small{display:block;font-weight:400;font-size:.75rem;opacity:.85}
  .slot:hover{border-color:var(--ink);color:var(--ink)}
  .slot.open{background:var(--ink);border:1px solid var(--ink);color:#fff}
  .slot.full{background:var(--copper);border:1px solid var(--copper);color:#fff}
  .slot:disabled{opacity:.4;cursor:not-allowed}
  .legend{display:flex;gap:18px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);margin:16px 0}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-1px;margin-right:6px;border:1px dashed #c4c4be}
  .legend i.o{background:var(--ink);border:0}.legend i.f{background:var(--copper);border:0}
  .tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:18px}
  .tools label{display:inline-flex;gap:8px;align-items:center;font-weight:600;font-size:.92rem}
  #toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:20;max-width:calc(100% - 32px)}

  @media print{
    header,.tabs,.bar,.stats,.acts,#toast,#tabBeschikbaarheid{display:none!important}
    body{background:#fff}.appt{break-inside:avoid;border-color:#999}
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <b>Haard &amp; Ketel<span>Beheer</span></b>
    <button class="btn small" id="logout" hidden>Afmelden</button>
  </div>
</header>

<main class="wrap">

  <form class="login" id="loginForm">
    <p class="label">Alleen voor de zaakvoerder</p>
    <h1>Aanmelden</h1>
    <label for="pw">Wachtwoord<input id="pw" type="password" autocomplete="current-password" required></label>
    <button class="btn dark" type="submit">Aanmelden</button>
    <p class="msg err" id="loginMsg" hidden style="margin-top:16px"></p>
  </form>

  <div id="app" hidden>
    <div class="tabs" role="tablist">
      <button role="tab" id="t1" aria-selected="true" aria-controls="tabAgenda">Agenda</button>
      <button role="tab" id="t2" aria-selected="false" aria-controls="tabBeschikbaarheid">Beschikbaarheid</button>
    </div>

    <!-- AGENDA -->
    <section id="tabAgenda" role="tabpanel" aria-labelledby="t1">
      <div class="stats">
        <div class="stat"><b id="sToday">–</b><span>afspraken vandaag</span></div>
        <div class="stat"><b id="sWeek">–</b><span>de komende 7 dagen</span></div>
        <div class="stat"><b id="sFree">–</b><span>vrije plaatsen komende 7 dagen</span></div>
      </div>
      <div class="bar">
        <div class="seg" role="group" aria-label="Periode">
          <button type="button" data-range="vandaag" aria-pressed="false">Vandaag</button>
          <button type="button" data-range="morgen" aria-pressed="false">Morgen</button>
          <button type="button" data-range="week" aria-pressed="true">7 dagen</button>
          <button type="button" data-range="alles" aria-pressed="false">Alles</button>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn small" id="copyDay">Planning kopiëren</button>
          <button class="btn small" id="printBtn">Afdrukken</button>
          <button class="btn small" id="refresh">Vernieuwen</button>
        </div>
      </div>
      <div id="agenda"></div>
    </section>

    <!-- BESCHIKBAARHEID -->
    <section id="tabBeschikbaarheid" role="tabpanel" aria-labelledby="t2" hidden>
      <div class="panel">
        <div class="wk-nav">
          <button class="btn small" id="wkPrev">‹ Vorige week</button>
          <b id="wkLabel"></b>
          <button class="btn small" id="wkNext">Volgende week ›</button>
        </div>
        <p style="color:var(--muted);font-size:.93rem">Klik op een voormiddag of namiddag om die open of dicht te zetten. Klanten zien alleen wat open staat en nog plaats heeft.</p>
        <div class="legend"><span><i></i>Dicht</span><span><i class="o"></i>Open</span><span><i class="f"></i>Volgeboekt</span></div>
        <div class="grid-scroll"><div class="wk" id="wkGrid"></div></div>
        <div class="tools" style="margin-top:18px">
          <label for="cap">Afspraken per dagdeel
            <select id="cap"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option><option>6</option></select>
          </label>
          <button class="btn small" id="wkStd">Ma–vr alles openzetten</button>
          <button class="btn small" id="wkCopy">Kopiëren naar volgende week</button>
          <button class="btn small danger" id="wkClear">Deze week alles sluiten</button>
        </div>
      </div>
    </section>
  </div>
</main>

<div id="toast" class="msg" hidden role="status"></div>

<script>
(function () {
  const PARTS = { VM: { label: 'Voormiddag', range: '8:00 – 12:00' }, NM: { label: 'Namiddag', range: '13:00 – 17:00' } };
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, '0');
  const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const dt = s => new Date(s + 'T12:00:00');
  const addDays = (s, n) => { const d = dt(s); d.setDate(d.getDate() + n); return ymd(d); };
  const fmt = (s, o) => dt(s).toLocaleDateString('nl-BE', o || { weekday: 'long', day: 'numeric', month: 'long' });
  const cap1 = s => s.charAt(0).toUpperCase() + s.slice(1);
  const today = () => ymd(new Date());
  const monday = s => { const d = dt(s); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return ymd(d); };

  let pw = '';
  try { pw = sessionStorage.getItem('hk-pw') || ''; } catch (e) {}
  let data = { slots: {}, bookings: [] };
  let range = 'week', weekStart = monday(today());

  function toast(text, kind) {
    const t = $('toast'); t.textContent = text; t.className = 'msg ' + (kind || 'ok'); t.hidden = false;
    clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 4000);
  }

  async function api(method, body, query) {
    const res = await fetch('/api/beheer' + (query || ''), {
      method, headers: { 'x-beheer-wachtwoord': pw, ...(body ? { 'content-type': 'application/json' } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    });
    const j = await res.json().catch(() => ({}));
    if (!res.ok) { const e = new Error(j.error || 'Er liep iets mis.'); e.status = res.status; throw e; }
    return j;
  }

  async function load() {
    const van = [today(), weekStart].sort()[0];
    const tot = [addDays(today(), 120), addDays(weekStart, 13)].sort().pop();
    data = await api('GET', null, '?van=' + van + '&tot=' + tot);
    render();
  }

  // ---------- Aanmelden ----------
  async function login(e) {
    if (e) e.preventDefault();
    if (e) pw = $('pw').value;
    const m = $('loginMsg'); m.hidden = true;
    try {
      await load();
      try { sessionStorage.setItem('hk-pw', pw); } catch (x) {}
      $('loginForm').hidden = true; $('app').hidden = false; $('logout').hidden = false;
    } catch (err) {
      try { sessionStorage.removeItem('hk-pw'); } catch (x) {}
      if (e) { m.textContent = err.message; m.hidden = false; }
    }
  }
  $('loginForm').addEventListener('submit', login);
  $('logout').onclick = () => { try { sessionStorage.removeItem('hk-pw'); } catch (x) {} location.reload(); };
  if (pw) login();

  // ---------- Tabs ----------
  const tabs = [[$('t1'), $('tabAgenda')], [$('t2'), $('tabBeschikbaarheid')]];
  tabs.forEach(([b, p]) => b.onclick = () => tabs.forEach(([b2, p2]) => { b2.setAttribute('aria-selected', b2 === b); p2.hidden = p2 !== p; }));

  // ---------- Agenda ----------
  const used = slot => data.bookings.filter(b => b.slot === slot).length;

  function inRange(d) {
    const t = today();
    if (range === 'vandaag') return d === t;
    if (range === 'morgen') return d === addDays(t, 1);
    if (range === 'week') return d >= t && d <= addDays(t, 6);
    return d >= t;
  }

  function render() {
    const t = today(), w = addDays(t, 6);
    const upcoming = data.bookings.filter(b => b.date >= t);
    $('sToday').textContent = upcoming.filter(b => b.date === t).length;
    $('sWeek').textContent = upcoming.filter(b => b.date <= w).length;
    $('sFree').textContent = Object.entries(data.slots).filter(([id]) => id.slice(0, 10) >= t && id.slice(0, 10) <= w)
      .reduce((n, [id, v]) => n + Math.max(0, v.cap - used(id)), 0);
    document.querySelectorAll('[data-range]').forEach(b => b.setAttribute('aria-pressed', b.dataset.range === range));
    renderAgenda(); renderWeek();
  }

  function renderAgenda() {
    const box = $('agenda'); box.textContent = '';
    const list = data.bookings.filter(b => inRange(b.date));
    if (!list.length) {
      const e = document.createElement('div'); e.className = 'empty';
      e.textContent = range === 'vandaag' ? 'Vandaag geen afspraken.' : range === 'morgen' ? 'Morgen geen afspraken.' : 'Geen afspraken in deze periode.';
      box.appendChild(e); return;
    }
    const days = [...new Set(list.map(b => b.date))].sort();
    days.forEach(d => {
      const items = list.filter(b => b.date === d);
      const sec = document.createElement('section'); sec.className = 'day';
      const head = document.createElement('div'); head.className = 'day-head';
      const h = document.createElement('h2'); h.textContent = cap1(fmt(d));
      if (d === today()) { const s = document.createElement('small'); s.textContent = 'VANDAAG'; h.appendChild(s); }
      const c = document.createElement('span'); c.className = 'label'; c.textContent = items.length + (items.length === 1 ? ' afspraak' : ' afspraken');
      head.append(h, c); sec.appendChild(head);
      ['VM', 'NM'].forEach(p => {
        const ps = items.filter(b => b.part === p);
        if (!ps.length) return;
        const row = document.createElement('div'); row.className = 'part';
        const lab = document.createElement('div'); lab.className = 'part-label';
        lab.innerHTML = '<b></b><span></span>';
        lab.children[0].textContent = PARTS[p].label; lab.children[1].textContent = PARTS[p].range;
        const cards = document.createElement('div'); cards.className = 'cards';
        ps.forEach(b => cards.appendChild(card(b)));
        row.append(lab, cards); sec.appendChild(row);
      });
      box.appendChild(sec);
    });
  }

  function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  function card(b) {
    const a = el('article', 'appt');
    const main = el('div');
    const h = el('h3', null, b.naam || 'Onbekend');
    h.appendChild(el('span', 'pill' + (/storing/i.test(b.type) ? ' storing' : ''), b.type || 'Afspraak'));
    const info = el('div', 'info');
    const addr = el('div'); addr.appendChild(el('span', 'ic', '⌖'));
    const am = el('a', null, b.adres || '—'); am.href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(b.adres || ''); am.target = '_blank'; am.rel = 'noopener';
    addr.appendChild(am);
    const tel = el('div'); tel.appendChild(el('span', 'ic', '☏'));
    const tm = el('a', 'mono', b.tel || '—'); tm.href = 'tel:' + String(b.tel || '').replace(/[^\d+]/g, '');
    tel.appendChild(tm);
    info.append(addr, tel);
    main.append(h, info);
    if (b.opmerking) main.appendChild(el('p', 'note', b.opmerking));
    if (b.geboektOp) main.appendChild(el('p', 'meta', 'Geboekt op ' + new Date(b.geboektOp).toLocaleString('nl-BE', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })));

    const acts = el('div', 'acts');
    const route = el('a', 'btn small', 'Route'); route.href = 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(b.adres || ''); route.target = '_blank'; route.rel = 'noopener';
    const call = el('a', 'btn small', 'Bellen'); call.href = tm.href;
    const cancel = el('button', 'btn small danger', 'Annuleren'); cancel.type = 'button';
    cancel.onclick = () => {
      const c = el('div', 'confirm'); c.appendChild(el('span', null, 'Afspraak annuleren?'));
      const yes = el('button', 'btn small danger', 'Ja'); const no = el('button', 'btn small', 'Nee');
      yes.onclick = async () => {
        yes.disabled = true;
        try { await api('POST', { actie: 'annuleer', seat: b.seat }); toast('Afspraak van ' + (b.naam || '') + ' geannuleerd.'); await load(); }
        catch (err) { toast(err.message, 'err'); yes.disabled = false; }
      };
      no.onclick = () => c.replaceWith(cancel);
      c.append(yes, no); cancel.replaceWith(c);
    };
    acts.append(route, call, cancel);
    a.append(main, acts);
    return a;
  }

  document.querySelectorAll('[data-range]').forEach(b => b.onclick = () => { range = b.dataset.range; render(); });
  $('refresh').onclick = () => load().then(() => toast('Bijgewerkt.')).catch(err => toast(err.message, 'err'));
  $('printBtn').onclick = () => window.print();
  $('copyDay').onclick = async () => {
    const list = data.bookings.filter(b => inRange(b.date));
    if (!list.length) { toast('Geen afspraken om te kopiëren.', 'err'); return; }
    const text = list.map(b => [cap1(fmt(b.date)) + ' – ' + PARTS[b.part].label, b.naam + ' (' + b.type + ')', b.adres, b.tel, b.opmerking].filter(Boolean).join('\n')).join('\n\n');
    try { await navigator.clipboard.writeText(text); toast('Planning gekopieerd. Plak ze in een bericht of notitie.'); }
    catch (e) { toast('Kopiëren lukte niet in deze browser.', 'err'); }
  };

  // ---------- Beschikbaarheid ----------
  const weekDays = () => Array.from({ length: 6 }, (_, i) => addDays(weekStart, i));
  const upcomingSlot = id => { const d = id.slice(0, 10), t = today(); return d > t || (d === t && id.endsWith('NM') && new Date().getHours() < 13) || (d === t && id.endsWith('VM') && new Date().getHours() < 8); };

  function renderWeek() {
    const days = weekDays();
    $('wkLabel').textContent = fmt(days[0], { day: 'numeric', month: 'short' }) + ' – ' + fmt(days[5], { day: 'numeric', month: 'short', year: 'numeric' });
    const g = $('wkGrid'); g.textContent = '';
    days.forEach(d => {
      const col = el('div', 'wk-col');
      const h = el('h4', null, cap1(fmt(d, { weekday: 'long' }))); h.appendChild(el('small', null, fmt(d, { day: 'numeric', month: 'short' })));
      col.appendChild(h);
      ['VM', 'NM'].forEach(p => {
        const id = d + '_' + p, s = data.slots[id], u = used(id);
        const b = el('button', 'slot'); b.type = 'button';
        b.appendChild(el('span', null, PARTS[p].label));
        let st;
        if (s && u >= s.cap) { b.classList.add('full'); st = u + '/' + s.cap + ' vol'; }
        else if (s) { b.classList.add('open'); st = u + '/' + s.cap + ' geboekt'; }
        else st = u ? u + ' geboekt · dicht' : 'dicht';
        b.appendChild(el('small', null, st));
        b.setAttribute('aria-pressed', s ? 'true' : 'false');
        b.setAttribute('aria-label', fmt(d) + ', ' + PARTS[p].label + ': ' + st);
        b.disabled = !upcomingSlot(id);
        b.onclick = () => change(data.slots[id] ? 'sluit' : 'open', [id]);
        col.appendChild(b);
      });
      g.appendChild(col);
    });
  }

  async function change(actie, ids, msgText) {
    try {
      const r = await api('POST', { actie, ids, plaatsen: +$('cap').value });
      await load();
      if (msgText) toast(msgText.replace('{n}', r.aantal));
    } catch (err) { toast(err.message, 'err'); }
  }

  $('wkPrev').onclick = () => { weekStart = addDays(weekStart, -7); load().catch(e => toast(e.message, 'err')); };
  $('wkNext').onclick = () => { weekStart = addDays(weekStart, 7); load().catch(e => toast(e.message, 'err')); };
  $('wkStd').onclick = () => change('open', weekDays().slice(0, 5).flatMap(d => [d + '_VM', d + '_NM']).filter(id => upcomingSlot(id) && !data.slots[id]), '{n} dagdelen opengezet.');
  $('wkClear').onclick = () => change('sluit', weekDays().flatMap(d => [d + '_VM', d + '_NM']).filter(id => data.slots[id]), '{n} dagdelen gesloten. Bestaande afspraken blijven staan.');
  $('wkCopy').onclick = async () => {
    const ids = weekDays().flatMap(d => [d + '_VM', d + '_NM']).filter(id => data.slots[id]).map(id => addDays(id.slice(0, 10), 7) + id.slice(10));
    if (!ids.length) { toast('Deze week staat nog niets open om te kopiëren.', 'err'); return; }
    weekStart = addDays(weekStart, 7);
    await change('open', ids, '{n} dagdelen gekopieerd naar volgende week.');
  };
})();
</script>
</body>
</html>
