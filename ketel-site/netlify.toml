# Netlify: kies bij het koppelen "ketel-site" als base directory.
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"


# Oude adressen naar de nieuwe pagina's
[[redirects]]
  from = "/beheer"
  to = "/beheer/"
  status = 301
[[redirects]]
  from = "/beheer.html"
  to = "/beheer/"
  status = 301
[[redirects]]
  from = "/privacy.html"
  to = "/privacy/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/beheer/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"

[[headers]]
  for = "/formulieren.html"
  [headers.values]
    X-Robots-Tag = "noindex"
