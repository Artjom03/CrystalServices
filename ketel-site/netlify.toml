# Netlify: kies bij het koppelen "ketel-site" als base directory.
[build]
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/beheer"
  to = "/beheer.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/beheer.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
