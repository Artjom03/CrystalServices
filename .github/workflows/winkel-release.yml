# Bouwt het Windows-programma Crystal Winkel en zet het als release op GitHub,
# telkens als de versie in winkel-app/desktop/package.json verandert.
# Het programma op de winkel-pc haalt die release zelf op (electron-updater).
name: Crystal Winkel release

on:
  push:
    branches: [main]
    paths: ['winkel-app/desktop/package.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: winkel-app/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # Eerst zelf één release (met tag) maken; anders maakt electron-builder er soms twee tegelijk,
      # en vindt het programma latest.yml niet.
      - name: Release maken
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          gh release view "v$V" >/dev/null 2>&1 || gh release create "v$V" --draft --title "Crystal Winkel $V" --notes "Crystal Winkel $V" --target "$GITHUB_SHA"
      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Pas zichtbaar maken als alle bestanden er staan; anders vindt het programma latest.yml nog niet.
      - name: Release publiceren
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v$(node -p "require('./package.json').version")" --draft=false --latest
